<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Headline Lab</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-glow" aria-hidden="true"></div>

    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <span class="brand-name">Headline&nbsp;Lab</span>
      </div>
      <nav class="tabs" id="tabs">
        <button class="tab" data-tab="generator">Generator</button>
        <button class="tab" data-tab="structures">Structures</button>
        <button class="tab" data-tab="topics">Topics</button>
      </nav>
      <div class="topbar-actions">
        <button id="btn-export" class="btn btn-ghost btn-sm" type="button">Export</button>
        <button id="btn-import" class="btn btn-ghost btn-sm" type="button">Import</button>
        <input id="file-import" type="file" accept="application/json,.json" hidden />
      </div>
    </header>

    <main id="view" class="view"></main>

    <!-- Modal host for add/edit forms -->
    <div id="modal-overlay" class="modal-overlay" hidden>
      <div class="modal" role="dialog" aria-modal="true">
        <div class="modal-head">
          <h2 id="modal-title">Edit</h2>
          <button id="modal-close" class="icon-btn" type="button" aria-label="Close">&times;</button>
        </div>
        <div id="modal-body" class="modal-body"></div>
        <div class="modal-foot">
          <button id="modal-cancel" class="btn btn-ghost" type="button">Cancel</button>
          <button id="modal-save" class="btn btn-primary" type="button">Save</button>
        </div>
      </div>
    </div>

    <div id="toast" class="toast" hidden></div>

    <script src="seed-topics.js"></script>
    <script src="seed-structures.js"></script>
    <script src="seed-scenes.js"></script>
    <script src="storage.js"></script>
    <script src="app.js"></script>
  </body>
</html>
